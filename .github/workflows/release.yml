# Create a draft GitHub Release when a version tag is pushed.
#
# The release is created as a DRAFT with auto-generated notes as a starting
# point only — auto-generated commit/PR titles are not user-friendly release
# notes. A maintainer must rewrite the body and publish the release manually.
#
# Publishing the release (draft → published) is what triggers
# sync-hassio-addons.yml to open the "edge" PR in the HA add-on repository —
# so nothing user-facing goes out until the notes have been curated.

name: Create release

on:
  push:
    tags:
      - "v*"

jobs:
  create-release:
    name: Create draft GitHub release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --draft \
            --generate-notes \
            --title "$TAG" \
            --repo "$GITHUB_REPOSITORY"
